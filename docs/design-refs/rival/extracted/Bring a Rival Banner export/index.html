<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bring a Rival Banner</title>
<style>
  html, body { margin:0; padding:0; background:#0B0B0B; }
  .rc-banner-wrap { width:390px; }
</style>
</head>
<body>

<!-- Bring a Rival banner — 390px mobile width. Assets in ./assets -->
<div class="rc-banner-wrap">
  <div style="margin:26px 16px 0 16px; border-radius:24px; background-color:#4B2A80; background-image:url('assets/rival-bg-live.png'); background-size:100% 100%; background-position:center; background-repeat:no-repeat; box-shadow:0 0 44px 8px rgba(139,69,240,0.26), 0 0 16px rgba(139,69,240,0.2); display:flex; align-items:center; gap:6px; padding:20px 16px 20px 18px; box-sizing:border-box;">
    <div style="flex:1 1 auto; min-width:0;">
      <div style="font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:26px; font-weight:bold; letter-spacing:-0.5px; color:#FFFFFF; text-transform:uppercase;">Bring a rival</div>
      <div style="font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:15px; color:#FFFFFF; margin-top:9px; white-space:nowrap;">RapidClash is all about real<br>opponents. Send this to whoever<br>you want to take money from first.</div>
      <div style="display:inline-flex; align-items:center; gap:10px; margin-top:14px; background:#8B45F0; border:3px solid #000000; border-radius:32px; padding:11px 18px 11px 16px; cursor:pointer;">
        <span style="font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:bold; letter-spacing:0.3px; color:#FFFFFF; text-transform:uppercase; white-space:nowrap;">Bring a rival</span>
        <img src="assets/arrow-right-bold.png" alt="" style="width:20px; height:15px; display:block;">
      </div>
    </div>
    <img src="assets/trophy-coins.png" alt="" style="width:134px; height:auto; display:block; flex:0 0 134px; margin-right:-8px;">
  </div>
</div>

</body>
</html>
